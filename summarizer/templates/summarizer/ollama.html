<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Browser (Ollama)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-lg p-8 space-y-6">
        <h2 class="text-2xl font-bold text-gray-800">Ollama Web Summarizer</h2>

        <!-- CSRF Token (hidden input for JavaScript to read from cookie) -->
        <form style="display:none;">
            {% csrf_token %}
        </form>

        <!-- Chat Form -->
        <div class="flex gap-4 items-center">
            <input id="urlInput" type="url" placeholder="Paste a URL to summarize..." required
                   class="flex-grow border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
            >
            <button id="submitBtn"
                    class="bg-purple-600 text-white px-6 py-2 rounded-xl hover:bg-purple-700 transition">
                Summarize
            </button>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-sm text-gray-500 hidden">Loading summary...</div>

        <!-- Chat Display -->
        <div id="chat" class="space-y-4 hidden">
            <!-- User message -->
            <div class="flex justify-end">
                <div id="userMsg" class="bg-purple-100 text-purple-800 p-4 rounded-xl max-w-xl text-right"></div>
            </div>

            <!-- Assistant reply -->
            <div class="flex justify-start">
                <div id="botMsg" class="bg-gray-100 text-gray-800 p-4 rounded-xl max-w-xl"></div>
            </div>
        </div>
    </div>

    <script>
        // Get CSRF token from cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const btn = document.getElementById("submitBtn");
        const input = document.getElementById("urlInput");
        const chat = document.getElementById("chat");
        const userMsg = document.getElementById("userMsg");
        const botMsg = document.getElementById("botMsg");
        const loading = document.getElementById("loading");

        btn.addEventListener("click", async () => {
            const url = input.value.trim();
            if (!url) return;

            chat.classList.add("hidden");
            loading.classList.remove("hidden");
            userMsg.textContent = url;
            botMsg.textContent = "";

            try {
                const response = await fetch("/summarize-ollama/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken") // ✅ Add CSRF token header
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                if (data.summary) {
                    botMsg.textContent = data.summary;
                    chat.classList.remove("hidden");
                } else {
                    botMsg.textContent = data.error || "Something went wrong.";
                    chat.classList.remove("hidden");
                }

            } catch (error) {
                botMsg.textContent = "Error: " + error.message;
                chat.classList.remove("hidden");
            } finally {
                loading.classList.add("hidden");
            }
        });
    </script>

</body>
</html>
